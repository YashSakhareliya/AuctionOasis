name: Auctionoasis Workflow
on:
  push:
    branches:
      - devops

  pull_request:
    branches: 
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Verify installation
        run: npm list --depth=0
      
      - name: Check for syntax errors
        run: node -c app.js
  
  lint-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check file structure
        run: |
          echo "Checking project structure..."
          ls -la
          echo "Verifying required files exist..."
          test -f package.json && echo "✓ package.json found"
          test -f app.js && echo "✓ app.js found"
          test -f Dockerfile && echo "✓ Dockerfile found"
  
  docker-build-push:
    runs-on: ubuntu-latest
    needs: [build-and-test, lint-check]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/auctionoasis
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  
  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs: docker-build-push
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Deploy to EC2 via SSM
        run: |
          # Send command to EC2 instance via Systems Manager
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy AuctionOasis from GitHub Actions" \
            --parameters 'commands=[
              "set -e",
              "echo \"=== Starting Deployment ===\"",
              "echo \"Checking Docker installation...\"",
              "docker --version || (echo \"Docker not found! Installing...\" && sudo yum install -y docker && sudo systemctl start docker && sudo systemctl enable docker)",
              "echo \"Adding user to docker group if needed...\"",
              "sudo usermod -aG docker ssm-user || true",
              "echo \"Logging into Docker Hub...\"",
              "echo ${{ secrets.DOCKER_HUB_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin",
              "echo \"Pulling latest Docker image...\"",
              "docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/auctionoasis:${{ github.ref_name }}-${{ github.sha }}",
              "echo \"Stopping old container if exists...\"",
              "docker stop auctionoasis 2>/dev/null || echo \"No existing container to stop\"",
              "docker rm auctionoasis 2>/dev/null || echo \"No existing container to remove\"",
              "echo \"Starting new container...\"",
              "docker run -d --name auctionoasis --restart unless-stopped -p 3000:3000 ${{ secrets.DOCKER_HUB_USERNAME }}/auctionoasis:${{ github.ref_name }}-${{ github.sha }}",
              "echo \"Verifying container is running...\"",
              "docker ps | grep auctionoasis",
              "echo \"Container logs:\"",
              "docker logs auctionoasis --tail 20",
              "echo \"Cleaning up old images...\"",
              "docker image prune -f",
              "echo \"=== Deployment completed successfully! ===\"",
              "echo \"Available images:\"",
              "docker images | grep auctionoasis",
              "echo \"Running containers:\"",
              "docker ps -a | grep auctionoasis"
            ]' \
            --timeout-seconds 300 \
            --output text \
            --query "Command.CommandId")
          
          echo "Command ID: $COMMAND_ID"
          echo "Waiting for command to complete..."
          
          # Wait for command to complete (with timeout)
          aws ssm wait command-executed \
            --command-id $COMMAND_ID \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} || true
          
          # Get command status and output
          echo "=== Command Output ==="
          aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query "StandardOutputContent" \
            --output text
          
          echo "=== Command Errors (if any) ==="
          aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query "StandardErrorContent" \
            --output text
          
          # Check command status
          STATUS=$(aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --query "Status" \
            --output text)
          
          echo "Command Status: $STATUS"
          
          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed with status: $STATUS"
            exit 1
          fi
  